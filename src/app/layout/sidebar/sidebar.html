<aside class="sidebar-wrapper" [class.collapsed]="isCollapsed()">
  <div class="sidebar-header">
    <div class="brand-monogram">
      <div class="spark-icon"></div>
    </div>
    <div class="brand-info">
      <span class="brand-title">LearningPurpose</span>
      <span class="brand-badge">Norde AI Edition</span>
    </div>
  </div>

  <div class="nav-section-title">CORE PLATFORM</div>

  <nav class="nav-stack">
    @for (item of navItems; track item.route) {
      <a [routerLink]="item.route" routerLinkActive="active-route" class="nav-link">
        <span class="nav-indicator"></span>
        <span class="nav-label">{{ item.label }}</span>
        @if (item.badge) {
          <span class="nav-pill">{{ item.badge }}</span>
        }
      </a>
    }
  </nav>

  <div class="sidebar-footer">
    <div class="ai-status-card">
      <div class="ai-pulse-dot"></div>
      <div class="ai-status-text">
        <span class="ai-title">Gemini Tutor Core</span>
        <span class="ai-sub">Online & Ready</span>
      </div>
    </div>
  </div>
</aside>
