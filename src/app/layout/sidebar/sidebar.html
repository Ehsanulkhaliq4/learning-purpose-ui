<aside class="sidebar-wrapper" [class.collapsed]="isCollapsed()" [class.mobile-menu-open]="isMobileMenuOpen()">
  <div class="sidebar-header">
    <div class="brand-monogram"><div class="spark-icon"></div></div>
    <div class="brand-info">
      <span class="brand-title">LearningPurpose</span>
      <span class="brand-badge">By Virtual Society</span>
    </div>
    <button type="button" class="mobile-menu-toggle" (click)="toggleMobileMenu()" [attr.aria-expanded]="isMobileMenuOpen()" aria-controls="mobile-navigation" aria-label="Toggle navigation menu">
      <span class="menu-button-label">Menu</span><span class="menu-chevron">&#8964;</span>
    </button>
  </div>

  <div id="mobile-navigation" class="mobile-navigation">
    <div class="nav-section-title">CORE PLATFORM</div>

    <nav class="nav-stack">
      @for (item of navItems; track item.route) {
        <a [routerLink]="item.route" routerLinkActive="active-route" class="nav-link">
          <span class="nav-indicator"></span>
          <span class="nav-label">{{ item.label }}</span>
          <span class="nav-pill">{{ item.badge || 'Active' }}</span>
        </a>
      }
    </nav>

    @if (auth.isAdmin()) {
      <div class="nav-section-title admin-nav-title">ADMINISTRATION</div>
      <nav class="nav-stack admin-nav-stack">
        <a routerLink="/admin/quiz/categories" routerLinkActive="active-route" class="nav-link"><span class="nav-indicator"></span><span class="nav-label">Assessment Studio</span><span class="nav-pill">Active</span></a>
        <a routerLink="/admin/operations" routerLinkActive="active-route" class="nav-link"><span class="nav-indicator"></span><span class="nav-label">Operations Console</span><span class="nav-pill">Live</span></a>
      </nav>
    }

    <div class="sidebar-footer">
      <div class="company-brand-card">
        <div class="company-brand-mark">
          <img src="/virtual-society-logo.svg" alt="Virtual Society" class="brand-logo-img" />
        </div>
        <div class="company-brand-info">
          <div class="company-brand-name">
            <span class="brand-word-virtual">VIRTUAL</span>
            <span class="brand-word-society">SOCIETY</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</aside>
