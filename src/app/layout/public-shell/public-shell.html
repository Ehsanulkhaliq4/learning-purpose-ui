<div class="public-layout">
  <header class="public-navbar">
    <a routerLink="/" class="brand-link">
      <span class="brand-monogram"><span class="spark-icon"></span></span>
      <span class="brand-name">LearningPurpose</span>
    </a>

    <nav class="public-nav" aria-label="Account navigation">
      <a routerLink="/explore" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Explore</a>
      <button type="button" class="signin-link" (click)="authDialogService.open('login')">Sign In</button>
      <button type="button" class="register-link" (click)="authDialogService.open('register')">Register</button>
    </nav>
  </header>

  <main class="public-content">
    <router-outlet />
  </main>

  <dialog
    #authDialog
    class="auth-dialog"
    [class.login-dialog]="authDialogService.mode() === 'login'"
    [class.register-dialog]="authDialogService.mode() === 'register'"
    (click)="closeOnBackdrop($event)"
    (close)="closeAuthDialog()"
  >
    @if (authDialogService.mode() === 'login') {
      <app-login [dialogMode]="true" (dialogModeChange)="authDialogService.open($event)" />
    } @else if (authDialogService.mode() === 'register') {
      <app-register-applicant [dialogMode]="true" (dialogModeChange)="authDialogService.open($event)" />
    }
  </dialog>
</div>
